name: Build Anime Novel APK
on:
  push:
    branches:
      - '**'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Build with Gradle
        run: gradle assembleDebug -p AnimeNovelApp

      - name: Upload APK
        uses: actions/upload-artifact@v3
        with:
          name: AnimeNovelApp-debug
          path: AnimeNovelApp/app/build/outputs/apk/debug/app-debug.apk
