# ЭТО ГОТОВЫЙ workflow для сборки APK на серверах GitHub.
# Я не могу запушить файлы в .github/workflows (у токена песочницы нет права `workflows`),
# поэтому добавьте его САМИ один раз через веб-интерфейс GitHub:
#
#   1) Откройте: github.com/nurislamtagirov444-wq/nurislamtagirov444-wq.github.io
#      → Actions → «New workflow» → «set up a workflow yourself»
#   2) Вставьте ВЕСЬ текст ниже → Commit changes (в ветку main ЛЮБОЙ — триггер настроен на arena/**)
#   3) Actions → «build-apk» → «Run workflow» → выбрать ветку arena/019fbeee-... → Run
#   4) Когда побелеет зелёная галочка (~8–12 мин): внизу страницы рана → Artifacts →
#      «mayak-debug-apk» → скачать zip, внутри app-debug.apk
#
# Дальше каждая моя правка будет пересобирать APK автоматически при пуше.

name: build-apk

on:
  workflow_dispatch:
  push:
    branches:
      - 'arena/**'

permissions:
  contents: read

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install deps
        working-directory: game
        run: npm ci

      - name: Build web bundle
        working-directory: game
        run: npm run build

      - name: Refresh android project (cap sync)
        working-directory: game
        run: npx cap sync android

      - name: Assemble debug APK (Android SDK is preinstalled on the runner)
        working-directory: game/android
        run: ./gradlew assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: mayak-debug-apk
          path: game/android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
